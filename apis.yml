  - type: Overlay
    url: overlays/kroo-account-info-overlay.yaml
- aid: kroo:kroo-payment-initiation-api
  name: Kroo Payment Initiation API
  description: Kroo's PSD2 Payment Initiation Service (PIS) dedicated interface, conformant to the OBIE
    Read/Write Payment Initiation API Standard. Lets FCA-authorised PISP third parties initiate domestic
    payments, scheduled payments, standing orders, and file payments from a customer's Kroo current account
    with their consent. FAPI-secured (OAuth2/OIDC + mTLS + PSD2 SCA via CIBA); access requires TPP onboarding
    through the Kroo developer portal.
  humanURL: https://developer.kroo.banfico.io/
  baseURL: ''
