  - type: Overlay
    url: overlays/kroo-payment-initiation-overlay.yaml
- aid: kroo:kroo-confirmation-of-funds-api
  name: Kroo Confirmation of Funds API
  description: Kroo's PSD2 Confirmation of Funds Service (CBPII) dedicated interface, conformant to the
    OBIE Read/Write Confirmation of Funds API Standard. Lets FCA-authorised CBPII third parties confirm,
    with customer consent, whether a specified amount is available on a Kroo account without disclosing
    the balance. FAPI-secured (OAuth2/OIDC + mTLS + PSD2 SCA via CIBA); access requires TPP onboarding
    through the Kroo developer portal.
  humanURL: https://developer.kroo.banfico.io/
