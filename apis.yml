name: Kroo
kind: company
description: Kroo Bank Ltd is a UK app-based challenger bank, founded in 2016 and granted a full UK banking
  licence by the PRA/FCA in 2021 (restrictions lifted in 2022), that launched its digital-only personal
  current account in December 2022. Independent and venture-backed rather than mutual or part of a larger
  group, Kroo offers a fee-free everyday current account, interest-paying balances and "Kroo Pots", fee-free
  spending abroad, and FSCS deposit protection up to GBP 85,000. As an FCA-authorised ASPSP under PSD2,
  Kroo is a regulated Open Banking provider (though not one of the nine CMA9-mandated banks and, as a
  branchless digital bank, it publishes no Open Data reference APIs for ATMs or branches). It exposes
  the UK Open Banking Implementation Entity (OBIE) Read/Write API family - Account and Transaction Information,
  Payment Initiation, and Confirmation of Funds - through a Banfico-hosted developer portal at developer.kroo.banfico.io,
  secured with FAPI-grade OAuth2/OIDC, PSD2 strong customer authentication implemented as a CIBA decoupled
  (poll-mode) flow, and mutual-TLS client authentication using OBIE/eIDAS certificates, validated with
  the OpenID Foundation conformance suite.
