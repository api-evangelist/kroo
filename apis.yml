apis:
- aid: kroo:kroo-account-information-api
  name: Kroo Account and Transaction Information API
  description: Kroo's PSD2 Account Information Service (AIS) dedicated interface, conformant to the OBIE
    Read/Write Account and Transaction API Standard. Lets FCA-authorised AISP third parties retrieve,
    with customer consent, account details, balances, transactions, beneficiaries, standing orders, direct
    debits, scheduled payments, and statements. FAPI-secured (OAuth2/OIDC + mTLS + PSD2 SCA via CIBA);
    access requires TPP onboarding through the Kroo developer portal.
  humanURL: https://developer.kroo.banfico.io/
  baseURL: ''
  tags:
  - Account Information
  - AIS
  - Open Banking
  - OBIE
  properties:
  - type: OpenAPI
    url: openapi/obie-account-info-openapi.yaml
  - type: Documentation
